<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "allowScriptTags": false}'>
  <title>{% block titel %}DEMIS-Meldeassistent{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  {% if testbetrieb %}
  <div class="testband" role="note">TESTBETRIEB: Es werden ausschließlich erfundene Testdaten verwendet. Es wird nichts an DEMIS gesendet.</div>
  {% endif %}
  <header class="kopf">
    <a class="logo" href="/">DEMIS-Meldeassistent</a>
    {% if benutzer %}
    <form class="abmelden" method="post" action="/abmelden">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <span class="benutzer">Angemeldet: {{ benutzer }}</span>
      <button type="submit" class="knopf klein">Abmelden</button>
    </form>
    {% endif %}
  </header>
  <main id="inhalt">
    {% block inhalt %}{% endblock %}
  </main>
</body>
</html>
